name: Auto Deploy via SSH

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.1'
          extensions: zip, curl, mbstring, xml

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

  deploy:
    name: Deploy to server via SSH
    runs-on: ubuntu-latest
    needs: test
    # Only run deploy if on main and required secrets are present
    if: ${{ github.ref_name == 'main' && secrets.SSH_PRIVATE_KEY && secrets.DEPLOY_HOST && secrets.DEPLOY_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run remote deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Deploying ${BRANCH} to ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
          ssh -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; mkdir -p '${DEPLOY_PATH}'; cd '${DEPLOY_PATH}'; \
             if [ -d .git ]; then \
               git fetch --depth=1 origin '${BRANCH}' && git reset --hard origin/'${BRANCH}'; \
             else \
               git clone --depth=1 --single-branch --branch '${BRANCH}' git@github.com:${{ github.repository }}.git .; \
             fi"
