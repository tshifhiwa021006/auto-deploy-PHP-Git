name: Auto Deploy via SSH

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.1'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test || true

  deploy:
    name: Deploy to server via SSH
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_name == 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run remote deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BRANCH: ${{ secrets.BRANCH || 'main' }}
        run: |
          echo "Deploying $GITHUB_REF_NAME to $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '${DEPLOY_PATH}' && cd '${DEPLOY_PATH}' && if [ -d .git ]; then git fetch --depth=1 origin ${BRANCH} && git reset --hard origin/${BRANCH}; else git clone --depth=1 --branch ${BRANCH} ${GITHUB_SERVER_URL}/${{ github.repository }}.git .; fi && composer install --no-dev --optimize-autoloader || true && chmod +x bin/*.php scripts/*.sh || true && php bin/deploy.php --branch ${BRANCH}"
